<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.page-content{max-width:none!important;padding:0!important;margin:0!important;background:transparent!important;border:none!important;border-radius:0!important;box-shadow:none!important}
#adoc{font-family:'Roboto',sans-serif;background:#f4f5f6;min-height:80vh}
#vs{background:#1b3e5f;padding:28px 24px}
.vs-title{color:#fff;font-size:1.3rem;font-weight:700;margin-bottom:16px}
.vs-tabs{display:flex;gap:4px;margin-bottom:14px}
.vs-tab{background:rgba(255,255,255,0.12);color:#fff;border:none;padding:7px 18px;border-radius:3px 3px 0 0;cursor:pointer;font-size:.85rem;font-family:'Roboto',sans-serif}
.vs-tab.active{background:#ff6b00;color:#fff}
.vs-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.vs-row select,.vs-row input{flex:1;min-width:140px;padding:9px 12px;border:1px solid #ccc;border-radius:3px;font-size:.9rem;font-family:'Roboto',sans-serif;background:#fff}
.vs-btn{background:#ff6b00;color:#fff;border:none;padding:10px 24px;border-radius:3px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Roboto',sans-serif;white-space:nowrap}
.vs-btn:hover{background:#e55f00}
#pop-strip{background:#fff;border-bottom:1px solid #e0e0e0;overflow:hidden;padding:0 8px}
.ps-head{color:#1b3e5f;font-size:.95rem;font-weight:700;padding:12px 16px 8px}
.ps-inner{overflow-x:auto;scrollbar-width:thin}
#ps-scroll{display:flex;padding:0 8px 12px;gap:8px;min-width:max-content}
.ps-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;width:90px;text-align:center}
.ps-icon{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px}
.ps-name{font-size:.68rem;color:#333;line-height:1.2}
#cat-main{display:flex;gap:0;padding:16px;max-width:1440px;margin:0 auto}
#cat-sb{width:220px;min-width:180px;background:#fff;border:1px solid #e0e0e0;border-radius:4px;padding:12px;margin-right:16px;align-self:flex-start;position:sticky;top:60px}
.sb-head{font-size:.9rem;font-weight:700;color:#1b3e5f;margin-bottom:8px}
#sbIn{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:3px;font-size:.82rem;margin-bottom:8px;font-family:'Roboto',sans-serif;box-sizing:border-box}
.sb-ltrs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.sb-ltrs button{background:#f4f5f6;border:1px solid #ddd;padding:2px 6px;border-radius:2px;font-size:.72rem;cursor:pointer;font-family:'Roboto',sans-serif}
.sb-ltrs button.sba{background:#ff6b00;color:#fff;border-color:#ff6b00}
.sbg h4{font-size:.78rem;font-weight:700;color:#1b3e5f;margin:6px 0 3px}
.sbg ul{list-style:none;margin:0;padding:0}
.sbg li.sbih{display:none}
.sbg li a{font-size:.75rem;color:#333;text-decoration:none;display:block;padding:2px 0}
.sbg li a:hover{color:#ff6b00}
#cat-grid38{flex:1;min-width:0}
.cg-head{font-size:1rem;font-weight:700;color:#1b3e5f;margin-bottom:12px}
.cg38{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cg38-tile{background:#fff;border:1px solid #e8e8e8;border-radius:4px;display:flex;flex-direction:column;align-items:center;padding:12px 8px;text-decoration:none;transition:box-shadow .15s}
.cg38-tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);border-color:#ff6b00}
.cg38-img{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.cg38-name{font-size:.72rem;color:#1b3e5f;text-align:center;line-height:1.3;font-weight:500}
#prods-sect{background:#fff;border-top:1px solid #e0e0e0;padding:20px 24px;max-width:1440px;margin:0 auto}
.prods-head{font-size:1rem;font-weight:700;color:#1b3e5f;margin-bottom:14px}
#prods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pc{background:#fff;border:1px solid #e8e8e8;border-radius:4px;text-decoration:none;display:block;overflow:hidden;transition:box-shadow .15s}
.pc:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pc-img{height:130px;display:flex;align-items:center;justify-content:center;background:#f9f9f9;overflow:hidden}
.pc-img img{max-height:130px;max-width:100%;object-fit:contain}
.pc-body{padding:10px 12px}
.pc-title{font-size:.82rem;font-weight:500;color:#1b3e5f;margin-bottom:4px;line-height:1.3}
.pc-price{font-size:.9rem;font-weight:700;color:#ff6b00;margin-bottom:8px}
.pc-btn{background:#ff6b00;color:#fff;border-radius:3px;padding:5px 10px;font-size:.75rem;font-weight:700;text-align:center}
@media(max-width:768px){
#cat-main{flex-direction:column;padding:8px}
#cat-sb{width:100%;min-width:unset;margin-right:0;margin-bottom:12px;position:static}
.cg38{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
#prods-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<div id="adoc">
<section id="vs">
  <div class="vs-title">Trouver des pieces pour votre vehicule</div>
  <div class="vs-tabs">
    <button class="vs-tab active" onclick="vsTab('m',this)">Par marque / modele</button>
    <button class="vs-tab" onclick="vsTab('i',this)">Par immatriculation</button>
  </div>
  <div id="vs-m">
    <div class="vs-row">
      <select id="vsMake" onchange="vsModels()"><option value="">Selectionnez une marque</option></select>
      <select id="vsMod" onchange="vsEngines()" disabled><option value="">Choisissez un modele</option></select>
      <select id="vsEng" disabled><option value="">Choisissez une motorisation</option></select>
      <button class="vs-btn" onclick="vsGo()">Chercher des pieces</button>
    </div>
  </div>
  <div id="vs-i" style="display:none">
    <div class="vs-row">
      <input id="immatIn" type="text" placeholder="Ex: 123456-201-16">
      <button class="vs-btn" onclick="immatGo()">Rechercher</button>
    </div>
  </div>
</section>

<section id="pop-strip">
  <div class="ps-head">Recherches populaires</div>
  <div class="ps-inner"><div id="ps-scroll"></div></div>
</section>

<div id="cat-main">
  <aside id="cat-sb">
    <div class="sb-head">Chercher une piece A-Z</div>
    <input id="sbIn" type="text" placeholder="Filtrer..." oninput="sbFilter(this.value)">
    <div class="sb-ltrs">
      <button class="sba" onclick="sbL('',this)">Tout</button>
      <button onclick="sbL('A',this)">A</button><button onclick="sbL('B',this)">B</button>
      <button onclick="sbL('C',this)">C</button><button onclick="sbL('D',this)">D</button>
      <button onclick="sbL('E',this)">E</button><button onclick="sbL('F',this)">F</button>
      <button onclick="sbL('G',this)">G</button><button onclick="sbL('H',this)">H</button>
      <button onclick="sbL('I',this)">I</button><button onclick="sbL('J',this)">J</button>
      <button onclick="sbL('K',this)">K</button><button onclick="sbL('L',this)">L</button>
      <button onclick="sbL('M',this)">M</button><button onclick="sbL('N',this)">N</button>
      <button onclick="sbL('O',this)">O</button><button onclick="sbL('P',this)">P</button>
      <button onclick="sbL('R',this)">R</button><button onclick="sbL('S',this)">S</button>
      <button onclick="sbL('T',this)">T</button><button onclick="sbL('V',this)">V</button>
    </div>
    <div id="sb-list"></div>
  </aside>

  <div id="cat-grid38">
    <div class="cg-head">Toutes les categories de pieces</div>
    <div class="cg38" id="cg38"></div>
  </div>
</div>

<div id="prods-sect">
  <div class="prods-head">Nouveaux produits</div>
  <div id="prods-grid"><p style="color:#999">Chargement...</p></div>
</div>
</div>

<script defer src="https://cdn.shopify.com/s/files/1/1016/8965/5639/files/pdz-catalogue_a80d1913-55fc-4aec-b7f7-55651824e204.js?v=1779113374"></script>
